{{- if and .Values.internalIngress.enabled .Values.internalIngress.kong.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ printf "%s-internal" (include "incloud-ingress.fullname" .) }}
  labels:
    {{- include "incloud-ingress.internalIngress.commonLabels" . | nindent 4 }}
    app.kubernetes.io/name: kong-internal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ printf "%s-internal" (include "incloud-ingress.fullname" .) }}
  minReplicas: {{ .Values.internalIngress.kong.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.internalIngress.kong.autoscaling.maxReplicas }}
  metrics:
    {{- toYaml .Values.internalIngress.kong.autoscaling.metrics | nindent 4 }}
{{- end }}
