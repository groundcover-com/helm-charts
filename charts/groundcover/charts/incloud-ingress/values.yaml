ingressClass: kong
secure: '{{ include "incloud-ingress.secure" .}}'

kong-crds:
  upgradeCRDs: true
  image:
    repository: 'public.ecr.aws/groundcovercom/tools' 
    tag: '20260929'

kong:
  replicaCount: 2
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 15
    metrics:
      - type: ContainerResource
        containerResource:
          name: cpu
          container: proxy
          target:
            type: Utilization
            averageUtilization: 65
      - type: ContainerResource
        containerResource:
          name: memory
          container: proxy
          target:
            type: Utilization
            averageUtilization: 75
  image:
    tag: 3.9.3-mini-20260929-1
    repository: public.ecr.aws/groundcovercom/kong
  ingressController:
    image:
      tag: "3.5.3-20260205"
      repository: public.ecr.aws/groundcovercom/kong/kubernetes-ingress-controller  
  deployment:
    minReadySeconds: 15
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1  
  env:
    anonymous_reports: "off"
    dump_config: "true"
    headers: "off"
    mem_cache_size: "256m"
    upstream_keepalive_max_requests: "0"
    nginx_http_client_body_buffer_size: "10m"
    nginx_mem_cache_size: "256m"
    proxy_access_log: "/dev/stdout custom_fmt"
    nginx_http_log_format: |
      custom_fmt '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"'
  proxy:
    admin:
      enabled: true
      type: ClusterIP    
    http:
      enabled: false
    tls:
      enabled: true
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: kong
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: kong
  podDisruptionBudget:
    enabled: true
    maxUnavailable: "1%"
## Kong Plugins for inCloud functionality
datasource:
  enabled: false

ingress:
  annotations:

# Exposes the ingestor's profile endpoints through the authenticated inCloud ingress.
# Requests use the same API-key authentication as other ingestion routes.
profileIngestion:
  enabled: true
  otlp:
    # Exposes the OTLP Profiles HTTP and gRPC endpoints.
    enabled: true
  
cert-manager:
  enabled: false
  crds:
    enabled: false
  prometheus:
    enabled: true
    servicemonitor:
      enabled: false

cert-manager-crds:
  enabled: false
  upgradeCRDs: true
  image:
    repository: public.ecr.aws/groundcovercom/tools
    tag: "20260929"

# Internal ingress configuration for routing to cluster-internal services
internalIngress:
  enabled: false
  # Name for the internal ingress class
  ingressClassName: kong-internal
  # Service configuration for internal cluster access
  service:
    # Service name for the internal ingress
    name: kong-internal
    # Service type - ClusterIP for cluster-internal access only
    type: ClusterIP
    # Annotations for the service
    annotations: {}
    # HTTP port configuration
    http:
      enabled: true
      port: 80
      targetPort: 8000
    # HTTPS/TLS port configuration - disabled for internal ingress (no TLS required)
    https:
      enabled: false
      port: 443
      targetPort: 8443
  # Kong deployment configuration for internal ingress
  kong:
    replicaCount: 2
    image:
      tag: 3.9.3-mini-20260929-1
      repository: public.ecr.aws/groundcovercom/kong
    strategy:
      rollingUpdate:
        maxUnavailable: 33%
        maxSurge: 50%
    ingressController:
      image:
        tag: "3.5.3-20260205"
        repository: public.ecr.aws/groundcovercom/kong/kubernetes-ingress-controller
      # requests == limits for Guaranteed QoS; sized above the external Kong's 14d fleet peak (265Mi, 610m)
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 500m
          memory: 512Mi
    env:
      anonymous_reports: "off"
      dump_config: "true"
      headers: "off"
      mem_cache_size: "128m"
      upstream_keepalive_max_requests: "0"
      nginx_http_client_body_buffer_size: "10m"
      nginx_mem_cache_size: "128m"
      proxy_access_log: "/dev/stdout"
    # requests == limits for Guaranteed QoS; keeping the prior 1000m/1Gi ceiling for both
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 1000m
        memory: 1Gi
    # Pod topology spread for high availability
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: kong-internal
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: kong-internal
    # Pod disruption budget
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    # Disabled by default; when enabled, replicaCount below is ignored (HPA owns it)
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      metrics:
        - type: ContainerResource
          containerResource:
            name: cpu
            container: proxy
            target:
              type: Utilization
              averageUtilization: 35
        - type: ContainerResource
          containerResource:
            name: memory
            container: proxy
            target:
              type: Utilization
              averageUtilization: 75
  # Routes configuration - define your internal routes here
  routes: []
  # Example route configuration:
  # routes:
  #   - name: example-service
  #     paths:
  #       - path: /api/example
  #         pathType: Prefix
  #     service:
  #       name: example-service  # must be in the same namespace as this release
  #       port: 8080
  #     plugins: []
  #     # Optional: strip path before forwarding
  #     stripPath: false
