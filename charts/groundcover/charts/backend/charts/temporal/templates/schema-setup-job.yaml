{{- if .Values.global.temporal.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "temporal.schemaSetup.jobName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with include "temporal.schemaSetup.annotations" . | trim }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: schema-setup
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 43200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: schema-setup
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "temporal.nodeSelector" .) }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "temporal.tolerations" .) }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "temporal.nodeAffinity" .) }}
      affinity:
        nodeAffinity:
          {{- . | nindent 10 }}
      {{- end }}
      containers:
      - name: schema-setup
        image: "{{ .Values.temporalConfig.adminTools.image.repository }}:{{ .Values.temporalConfig.adminTools.image.tag | default "1.29.1-tctl-1.18.4-cli-1.5.0" }}"
        imagePullPolicy: {{ .Values.temporalConfig.adminTools.image.pullPolicy | default "IfNotPresent" }}
        env:
        - name: SQL_PLUGIN
          value: "postgres12"
        - name: SQL_HOST
          {{- if eq .Values.temporalConfig.postgres.host "NONE" }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.temporalConfig.postgres.secret.name | quote }}
              key: {{ .Values.temporalConfig.postgres.secret.hostKey | quote }}
          {{- else }}
          value: {{ .Values.temporalConfig.postgres.host | quote }}
          {{- end }}
        - name: SQL_PORT
          value: {{ .Values.temporalConfig.postgres.port | quote }}
        - name: SQL_USER
          {{- if eq .Values.temporalConfig.postgres.username "NONE" }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.temporalConfig.postgres.secret.name | quote }}
              key: {{ .Values.temporalConfig.postgres.secret.usernameKey | quote }}
          {{- else }}
          value: {{ .Values.temporalConfig.postgres.username | quote }}
          {{- end }}
        - name: SQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.temporalConfig.postgres.secret.name | quote }}
              key: {{ .Values.temporalConfig.postgres.secret.passwordKey | quote }}
        - name: TEMPORAL_DB
          value: {{ .Values.temporalConfig.postgres.database | quote }}
        - name: VISIBILITY_DB
          value: {{ printf "%s_visibility" .Values.temporalConfig.postgres.database | quote }}
        - name: ADMIN_DB
          value: {{ .Values.temporalConfig.postgres.adminDatabase | default "postgres" | quote }}
        - name: REQUIRED_TEMPORAL_SCHEMA
          value: {{ dig "schemaSetup" "requiredVersions" "temporal" "1.18" .Values.temporalConfig | quote }}
        - name: REQUIRED_VISIBILITY_SCHEMA
          value: {{ dig "schemaSetup" "requiredVersions" "visibility" "1.13" .Values.temporalConfig | quote }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
{{ .Files.Get "files/assert-schema.sh" | indent 10 }}

          echo "Checking admin-tools image for required schema versions..."
          assert_admin_tools_image

          export PGPASSWORD=$SQL_PASSWORD
          echo "Waiting for PostgreSQL..."
          i=0
          while [ "$i" -lt 60 ]; do
            if psql -h "$SQL_HOST" -p "$SQL_PORT" -U "$SQL_USER" -d "$ADMIN_DB" -tAc "SELECT 1" >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            i=$((i+1))
            echo "Attempt $i/60: PostgreSQL not ready yet, waiting..."
            sleep 5
          done
          if [ "$i" -ge 60 ]; then
            echo "timed out waiting for PostgreSQL" >&2
            exit 1
          fi

          echo "Creating Temporal databases..."

          # Echo debian:mini admin-tools has no grep; use psql -tAc instead.
          echo "Creating database $TEMPORAL_DB if it doesn't exist..."
          if [ "$(psql -h $SQL_HOST -p $SQL_PORT -U $SQL_USER -d $ADMIN_DB -tAc "SELECT 1 FROM pg_database WHERE datname = '$TEMPORAL_DB'")" != "1" ]; then
            psql -h $SQL_HOST -p $SQL_PORT -U $SQL_USER -d $ADMIN_DB -c "CREATE DATABASE \"$TEMPORAL_DB\""
          fi

          echo "Creating database $VISIBILITY_DB if it doesn't exist..."
          if [ "$(psql -h $SQL_HOST -p $SQL_PORT -U $SQL_USER -d $ADMIN_DB -tAc "SELECT 1 FROM pg_database WHERE datname = '$VISIBILITY_DB'")" != "1" ]; then
            psql -h $SQL_HOST -p $SQL_PORT -U $SQL_USER -d $ADMIN_DB -c "CREATE DATABASE \"$VISIBILITY_DB\""
          fi

          echo "Setting up Temporal schema..."

          # Setup temporal schema
          temporal-sql-tool \
            --tls {{ if .Values.temporalConfig.postgres.tls.enabled }}--tls-disable-host-verification{{ end }} \
            --plugin $SQL_PLUGIN \
            --ep $SQL_HOST \
            --port $SQL_PORT \
            --user $SQL_USER \
            --password $SQL_PASSWORD \
            --database $TEMPORAL_DB \
            setup-schema -v 0.0

          temporal-sql-tool \
            --tls {{ if .Values.temporalConfig.postgres.tls.enabled }}--tls-disable-host-verification{{ end }} \
            --plugin $SQL_PLUGIN \
            --ep $SQL_HOST \
            --port $SQL_PORT \
            --user $SQL_USER \
            --password $SQL_PASSWORD \
            --database $TEMPORAL_DB \
            update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned

          echo "Setting up Visibility schema..."

          # Setup visibility schema
          temporal-sql-tool \
            --tls {{ if .Values.temporalConfig.postgres.tls.enabled }}--tls-disable-host-verification{{ end }} \
            --plugin $SQL_PLUGIN \
            --ep $SQL_HOST \
            --port $SQL_PORT \
            --user $SQL_USER \
            --password $SQL_PASSWORD \
            --database $VISIBILITY_DB \
            setup-schema -v 0.0

          temporal-sql-tool \
            --tls {{ if .Values.temporalConfig.postgres.tls.enabled }}--tls-disable-host-verification{{ end }} \
            --plugin $SQL_PLUGIN \
            --ep $SQL_HOST \
            --port $SQL_PORT \
            --user $SQL_USER \
            --password $SQL_PASSWORD \
            --database $VISIBILITY_DB \
            update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

          echo "Verifying database schema versions..."
          assert_database_schema

          echo "Temporal schema setup completed successfully!"
{{- end }}