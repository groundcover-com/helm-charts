{{- define "sensor.configmap" -}}
{{- $profile := .profile -}}
{{- with .root -}}
{{- $out := dict -}}
{{- include "sensor.profile.values" (dict "root" . "profile" $profile "out" $out) -}}
{{- $sensorValues := $out.sensorValues -}}
{{- $sensorValues = set $sensorValues "alligatorConfigurationExists" (not (empty .Values.agent.alligator)) -}}
{{- $sensorValues = set $sensorValues "serviceName" "sensor" -}}
apiVersion: v1
data:
  config.yaml: |-
{{ include "groundcover.sensor.config" (merge (dict "sensorValues" $sensorValues) .) | indent 4 }}
kind: ConfigMap
metadata:
  labels:
    {{- include "groundcover.labels" . | nindent 4 }}
    {{- if .Values.agent.additionalLabels }}
{{ toYaml .Values.agent.additionalLabels | indent 4 }}
    {{- end }}
  annotations:
    groundcover_version: {{ default .Chart.AppVersion .Values.global.origin.tag }}
    {{- if .Values.agent.additionalAnnotations }}
{{ toYaml .Values.agent.additionalAnnotations | indent 4 }}
    {{- end }}
  name: sensor-configuration{{ include "sensor.profile.suffix" $profile }}
  namespace: {{ .Release.Namespace }}

{{ end -}}
{{- end -}}
{{ if .Values.global.agent.enabled }}
{{- range $profile := (.Values.agent.extraSensorProfiles | default (list (dict "name" ""))) }}
---
{{ include "sensor.configmap" (dict "root" $ "profile" $profile) }}
{{- end -}}
{{- end -}}
