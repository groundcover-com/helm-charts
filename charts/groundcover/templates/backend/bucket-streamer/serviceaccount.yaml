{{- if and (eq (include "bucket-streamer.enabled" .) "true") .Values.bucketStreamer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bucket-streamer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bucket-streamer.labels" . | nindent 4 }}
  {{- with .Values.bucketStreamer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
