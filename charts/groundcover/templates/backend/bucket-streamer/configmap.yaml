{{- if eq (include "bucket-streamer.enabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bucket-streamer.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bucket-streamer.labels" . | nindent 4 }}
data:
  # A template: the init container substitutes the ClickHouse password at pod
  # start, so it never lands in this ConfigMap. The Postgres password is not in
  # the DSN either; pgx reads it from PGPASSWORD on the container.
  config.yaml.template: |
{{ include "bucket-streamer.config" . | indent 4 }}
{{- end }}
