{{- if and .Values.global.backend.enabled .Values.global.monitorsService.enabled .Values.monitorsService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  annotations:
    groundcover_version: {{ default .Chart.AppVersion .Values.global.origin.tag }}
    {{- if .Values.monitorsService.additionalAnnotations }}
{{ toYaml .Values.monitorsService.additionalAnnotations | indent 4 }}
    {{- end }}
  labels:
    {{- include "groundcover.labels" . | nindent 4 }}
    app: monitors-service
    {{- if .Values.monitorsService.additionalLabels }}
{{ toYaml .Values.monitorsService.additionalLabels | indent 4 }}
    {{- end }}
  name: {{ include "monitors-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "monitors-service.fullname" . }}
  minReplicas: {{ .Values.monitorsService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.monitorsService.autoscaling.maxReplicas }}
  {{- with .Values.monitorsService.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  metrics:
  {{- if .Values.monitorsService.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.monitorsService.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.monitorsService.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.monitorsService.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
{{- end }}
