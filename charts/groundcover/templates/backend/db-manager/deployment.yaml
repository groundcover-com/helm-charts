{{ if .Values.global.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    groundcover_version: {{ default .Chart.AppVersion .Values.global.origin.tag }}
    {{- if .Values.dbManager.additionalAnnotations }}
{{ toYaml .Values.dbManager.additionalAnnotations | indent 4 }}
    {{- end }}    
  labels:
    {{- include "groundcover.labels" . | nindent 4 }}
    app: db-manager
    {{- if .Values.dbManager.additionalLabels }}
{{ toYaml .Values.dbManager.additionalLabels | indent 4 }}
    {{- end }}
  name: db-manager
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db-manager
  replicas: {{ .Values.dbManager.replicas }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"      
        groundcover_version: {{ default .Chart.AppVersion .Values.global.origin.tag }}
        {{- if .Values.dbManager.additionalAnnotations }}
{{ toYaml .Values.dbManager.additionalAnnotations | indent 8 }}
        {{- end }}
        {{- if .Values.dbManager.podAnnotations }}
{{ toYaml .Values.dbManager.podAnnotations | indent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/backend/db-manager/config/configMap.yaml") . | sha256sum }}
        {{- if .Values.global.clickhouse.dictionaryUser.enabled }}
        checksum/clickhouse-secret: {{ include "clickhouse.password" . | sha256sum }}
        {{- end }}
      labels:
        app: db-manager
        app.kubernetes.io/name: db-manager
        {{- include "groundcover.labels" . | nindent 8 }}
        {{- if .Values.dbManager.additionalLabels }}
{{ toYaml .Values.dbManager.additionalLabels | indent 8 }}
        {{- end }}
        {{- if .Values.dbManager.podLabels }}
{{ toYaml .Values.dbManager.podLabels | indent 8 }}
        {{- end }}
    spec:
{{- if .Values.dbManager.tolerations }}
      tolerations:
{{ toYaml .Values.dbManager.tolerations | indent 8 }}
{{- end }}
{{- if .Values.dbManager.affinity }}
      affinity:
{{ toYaml .Values.dbManager.affinity | indent 8 }}
{{- end }}
{{- if .Values.dbManager.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.dbManager.nodeSelector | indent 8 }}
{{- end }}
      imagePullSecrets: {{ include "imagePullSecrets" . }}
      serviceAccountName: {{ default "db-manager" .Values.dbManager.serviceAccount.name }}
      containers:
      - env:
        - name: GC_GROUNDCOVERVERSION
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['groundcover_version']
        - name: GC_CLICKHOUSE_PASS
          valueFrom:
            secretKeyRef:
              key: '{{ include "clickhouse.secretKey" . }}'
              name: '{{ include "clickhouse.secretName" . }}'
        {{- if .Values.global.clickhouse.dictionaryUser.enabled }}
        - name: GC_DICTIONARYUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: '{{ include "clickhouse.dictionaryUserSecretKey" . }}'
              name: '{{ include "clickhouse.dictionaryUserSecretName" . }}'
        {{- end }}
        - name: GC_STORAGEMANAGEMENT_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "postgresql.secretName" . }}
              key: {{ include "postgresql.adminPasswordKey" . }}
        {{- if .Values.global.monitorsStore.enabled }}
        - name: GC_MONITORSSTORE_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "postgresql.secretName" . }}
              key: {{ include "postgresql.adminPasswordKey" . }}
        {{- end }}
        {{- if eq (include "telemetry.enabled" .) "true" }}
        - name: GC_TRACING_HEADERS_APIKEY
          valueFrom:
            secretKeyRef:
              key: {{ template "groundcover.apikeySecretKey" . }}
              name: {{ template "groundcover.apikeySecretName" . }}
        {{- end }}
        {{- with .Values.dbManager.env }}
          {{ toYaml . | nindent 8 }}
        {{- end }}
        image: {{ tpl .Values.dbManager.image.repository . }}:{{ tpl .Values.dbManager.image.tag . }}
        imagePullPolicy: Always
        name: db-manager     
        ports:
        - containerPort: 9102
          name: metrics
        - containerPort: 8888
          name: http          
        resources:
{{- toYaml .Values.dbManager.resources | nindent 10 }}
{{- include "groundcover.containerResizePolicy" (dict "value" .Values.dbManager.resizePolicy "path" "dbManager.resizePolicy" "kubeVersion" .Capabilities.KubeVersion.GitVersion "indent" 8) }}
        volumeMounts:
        - mountPath: /config
          name: db-manager-config-volume
      initContainers:
      - name: check-ch-ready
        image: '{{ tpl .Values.curl.image.repository . }}:{{ tpl .Values.curl.image.tag . }}'
        env:
        - name: CLICKHOUSE_USER
          value: "manager"
        - name: CLICKHOUSE_PASS
          valueFrom:
            secretKeyRef:
              key: '{{ include "clickhouse.secretKey" . }}'
              name: '{{ include "clickhouse.secretName" . }}'
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -e
            CLICKHOUSE_PORT={{ .Values.global.clickhouse.containerPorts.http | int }}
{{- if (include "db-manager.minClickhouseVersion" .) }}
            MIN_VERSION="{{ include "db-manager.minClickhouseVersion" . }}"
            # Compare major.minor as numbers (e.g., 25.8 -> 2508, 25.10 -> 2510)
            MIN_NUM=$(echo "$MIN_VERSION" | awk -F. '{printf "%d%02d", $1, $2}')
{{- end }}

            # /ping answers while tables are still loading asynchronously, so wait until the shard's
            # loader has no pending jobs. Each shard is queried directly, not via the service.
            # Every failure here must retry, not exit: a failed init container is restarted.
            check_shard() {
              while true; do
                # manager's default database is 'default'
                RESULT=$(curl -s --connect-timeout 2 --max-time 5 -u "${CLICKHOUSE_USER}:${CLICKHOUSE_PASS}" \
                  "http://$1:${CLICKHOUSE_PORT}/?query=SELECT+version(),countIf(status='PENDING')+FROM+system.asynchronous_loader+FORMAT+TSV" || true)
                # Empty when the shard is down; a ClickHouse exception on auth or query errors.
                if ! printf '%s' "$RESULT" | grep -Eq "^[0-9]+\.[0-9]+[0-9.]*$(printf '\t')[0-9]+$"; then
                  echo "Waiting for $2 $1... $(printf '%s' "$RESULT" | head -c 200)"
                  sleep 2
                  continue
                fi
                ACTUAL_VERSION=$(printf '%s' "$RESULT" | cut -f1)
                PENDING=$(printf '%s' "$RESULT" | cut -f2)
{{- if (include "db-manager.minClickhouseVersion" .) }}
                if [ "$(echo "$ACTUAL_VERSION" | awk -F. '{printf "%d%02d", $1, $2}')" -lt "$MIN_NUM" ]; then
                  echo "ERROR: $2 $1 version $ACTUAL_VERSION is below minimum required $MIN_VERSION"
                  exit 1
                fi
{{- end }}
                if [ "$PENDING" -eq 0 ]; then
                  echo "$2 $1 (version $ACTUAL_VERSION) has finished loading tables"
                  return
                fi
                echo "Waiting for $2 $1 to load tables ($PENDING loader jobs pending)..."
                sleep 5
              done
            }

            # Wait for every shard db-manager dials: the service answers while one is still restarting.
            for SHARD in {{ include "clickhouse.shard0Name" . | trim }} {{ include "clickhouse.extraShardsList" . | fromYamlArray | join " " }}; do
              check_shard "${SHARD}" "ClickHouse shard"
            done
            echo 'ClickHouse is up'
{{- if (.Values.global.clickhouse.ha | default dict).enabled }}

            # db-manager migrates standby right after primary, so it must be ready too.
            for SHARD in {{ include "clickhouse.standby.shard0Name" . | trim }} {{ include "clickhouse.standby.extraShardsList" . | fromYamlArray | join " " }}; do
              check_shard "${SHARD}" "standby ClickHouse shard"
            done
            echo 'Standby ClickHouse is up'
{{- end }}
      - name: wait-for-db
        image: {{ include "postgresql.initContainers.image" . }}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "postgresql.secretName" . }}
              key: {{ include "postgresql.adminPasswordKey" . }}
        - name: POSTGRES_USER
          value: '{{ include "postgresql.username" . }}'
        - name: POSTGRES_DATABASE
          value: '{{ include "postgresql.database" . }}'
        command:
        - /bin/sh
        - -c
        args:
        - |
          pg_isready \
            -U "$POSTGRES_USER" \
            -d "dbname=$POSTGRES_DATABASE" \
            -h {{ splitList ":" (include "postgresql.base.url" .) | first }} \
            -p {{ splitList ":" (include "postgresql.base.url" .) | last }}
{{- if .Values.dbManager.priorityClassName }}
      priorityClassName: {{ .Values.dbManager.priorityClassName }}
{{- end }}
      volumes:
      - configMap:
          name: db-manager-config
        name: db-manager-config-volume
{{ end -}}