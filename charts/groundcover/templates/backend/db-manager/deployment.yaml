{{ if .Values.global.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    groundcover_version: {{ default .Chart.AppVersion .Values.global.origin.tag }}
    {{- if .Values.dbManager.additionalAnnotations }}
{{ toYaml .Values.dbManager.additionalAnnotations | indent 4 }}
    {{- end }}    
  labels:
    {{- include "groundcover.labels" . | nindent 4 }}
    app: db-manager
    {{- if .Values.dbManager.additionalLabels }}
{{ toYaml .Values.dbManager.additionalLabels | indent 4 }}
    {{- end }}
  name: db-manager
  namespace: {{ .Release.Namespace }}
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db-manager
  replicas: {{ .Values.dbManager.replicas }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"      
        groundcover_version: {{ default .Chart.AppVersion .Values.global.origin.tag }}
        {{- if .Values.dbManager.additionalAnnotations }}
{{ toYaml .Values.dbManager.additionalAnnotations | indent 8 }}
        {{- end }}
        {{- if .Values.dbManager.podAnnotations }}
{{ toYaml .Values.dbManager.podAnnotations | indent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/backend/db-manager/config/configMap.yaml") . | sha256sum }}
        {{- if .Values.global.clickhouse.dictionaryUser.enabled }}
        checksum/clickhouse-secret: {{ include "clickhouse.password" . | sha256sum }}
        {{- end }}
      labels:
        app: db-manager
        app.kubernetes.io/name: db-manager
        {{- include "groundcover.labels" . | nindent 8 }}
        {{- if .Values.dbManager.additionalLabels }}
{{ toYaml .Values.dbManager.additionalLabels | indent 8 }}
        {{- end }}
        {{- if .Values.dbManager.podLabels }}
{{ toYaml .Values.dbManager.podLabels | indent 8 }}
        {{- end }}
    spec:
{{- if .Values.dbManager.tolerations }}
      tolerations:
{{ toYaml .Values.dbManager.tolerations | indent 8 }}
{{- end }}
{{- if .Values.dbManager.affinity }}
      affinity:
{{ toYaml .Values.dbManager.affinity | indent 8 }}
{{- end }}
{{- if .Values.dbManager.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.dbManager.nodeSelector | indent 8 }}
{{- end }}
      imagePullSecrets: {{ include "imagePullSecrets" . }}
      serviceAccountName: {{ default "db-manager" .Values.dbManager.serviceAccount.name }}
      containers:
      - env:
        - name: GC_GROUNDCOVERVERSION
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['groundcover_version']
        - name: GC_CLICKHOUSE_PASS
          valueFrom:
            secretKeyRef:
              key: '{{ include "clickhouse.secretKey" . }}'
              name: '{{ include "clickhouse.secretName" . }}'
        {{- if .Values.global.clickhouse.dictionaryUser.enabled }}
        - name: GC_DICTIONARYUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: '{{ include "clickhouse.dictionaryUserSecretKey" . }}'
              name: '{{ include "clickhouse.dictionaryUserSecretName" . }}'
        {{- end }}
        - name: GC_STORAGEMANAGEMENT_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "postgresql.secretName" . }}
              key: {{ include "postgresql.adminPasswordKey" . }}
        {{- if and .Values.global.aiO11yService.enabled .Values.global.backend.enabled }}
        - name: GC_AIO11YSTORE_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "postgresql.secretName" . }}
              key: {{ include "postgresql.adminPasswordKey" . }}
        {{- end }}
        {{- if .Values.global.monitorsStore.enabled }}
        - name: GC_MONITORSSTORE_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "postgresql.secretName" . }}
              key: {{ include "postgresql.adminPasswordKey" . }}
        {{- end }}
        {{- if .Values.global.autonomousInfrastructure.enabled }}
        - name: GC_AUTOINFRACONFIGSTORE_DB_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "postgresql.secretName" . }}
              key: {{ include "postgresql.adminPasswordKey" . }}
        {{- end }}
        {{- if eq (include "telemetry.enabled" .) "true" }}
        - name: GC_TRACING_HEADERS_APIKEY
          valueFrom:
            secretKeyRef:
              key: {{ template "groundcover.apikeySecretKey" . }}
              name: {{ template "groundcover.apikeySecretName" . }}
        {{- end }}
        {{- with .Values.dbManager.env }}
          {{ toYaml . | nindent 8 }}
        {{- end }}
        image: {{ tpl .Values.dbManager.image.repository . }}:{{ tpl .Values.dbManager.image.tag . }}
        imagePullPolicy: Always
        name: db-manager     
        ports:
        - containerPort: 9102
          name: metrics
        - containerPort: 8888
          name: http          
        resources:
{{- toYaml .Values.dbManager.resources | nindent 10 }}
{{- include "groundcover.containerResizePolicy" (dict "value" .Values.dbManager.resizePolicy "path" "dbManager.resizePolicy" "kubeVersion" .Capabilities.KubeVersion.GitVersion "indent" 8) }}
        volumeMounts:
        - mountPath: /config
          name: db-manager-config-volume
      initContainers:
      - name: wait-for-db
        image: {{ include "postgresql.initContainers.image" . }}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "postgresql.secretName" . }}
              key: {{ include "postgresql.adminPasswordKey" . }}
        - name: POSTGRES_USER
          value: '{{ include "postgresql.username" . }}'
        - name: POSTGRES_DATABASE
          value: '{{ include "postgresql.database" . }}'
        command:
        - /bin/sh
        - -c
        args:
        - |
          pg_isready \
            -U "$POSTGRES_USER" \
            -d "dbname=$POSTGRES_DATABASE" \
            -h {{ splitList ":" (include "postgresql.base.url" .) | first }} \
            -p {{ splitList ":" (include "postgresql.base.url" .) | last }}
{{- if .Values.dbManager.priorityClassName }}
      priorityClassName: {{ .Values.dbManager.priorityClassName }}
{{- end }}
      volumes:
      - configMap:
          name: db-manager-config
        name: db-manager-config-volume
{{ end -}}
