{{- if and (eq (include "queue.enabled" .) "true") .Values.queue.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "queue.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "queue.labels" . | nindent 4 }}
  {{- with .Values.queue.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
