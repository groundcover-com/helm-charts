{{- if and (eq (include "queue-bucket-streamer.enabled" .) "true") .Values.queueBucketStreamer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "queue-bucket-streamer.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "queue-bucket-streamer.labels" . | nindent 4 }}
  {{- with .Values.queueBucketStreamer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
