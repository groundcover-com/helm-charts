{{- $common := list "nodeSelector" "tolerations" "affinity" "topologySpreadConstraints" -}}
{{- $components := list "vmstorage" "vmselect" "vminsert" -}}
{{- $defaults := (.Values.vmclusters).defaults | default dict -}}
{{- range $name, $overrides := (.Values.vmclusters).clusters }}
{{- $cluster := mergeOverwrite (deepCopy $defaults) (deepCopy ($overrides | default dict)) -}}
{{- /* cluster-level common scheduling block + cluster-level pdb default */ -}}
{{- $commonSpec := dict -}}
{{- range $k := $common -}}
{{- if hasKey $cluster $k }}{{- $_ := set $commonSpec $k (index $cluster $k) -}}{{- end -}}
{{- end -}}
{{- $clusterPdb := $cluster.pdb | default dict -}}
{{- /* base spec = everything that is not a component / helper key */ -}}
{{- $spec := omit $cluster "pdb" "vmauth" "nodeSelector" "tolerations" "affinity" "topologySpreadConstraints" -}}
{{- range $comp := $components -}}
{{- if hasKey $cluster $comp -}}
{{- $compSpec := index $cluster $comp | default dict -}}
{{- /* component value wins over cluster-level common scheduling */ -}}
{{- $merged := merge (deepCopy $compSpec) (deepCopy $commonSpec) -}}
{{- /* resolve pdb: component-level keys override cluster-level, missing keys inherited */ -}}
{{- $pdb := merge (deepCopy (index $compSpec "pdb" | default dict)) (deepCopy $clusterPdb) -}}
{{- $merged = omit $merged "pdb" -}}
{{- if $pdb.enable -}}
{{- $pdbSpec := dict -}}
{{- if hasKey $pdb "minAvailable" }}{{- $_ := set $pdbSpec "minAvailable" $pdb.minAvailable -}}{{- end -}}
{{- if hasKey $pdb "maxUnavailable" }}{{- $_ := set $pdbSpec "maxUnavailable" $pdb.maxUnavailable -}}{{- end -}}
{{- $_ := set $merged "podDisruptionBudget" $pdbSpec -}}
{{- end -}}
{{- $_ := set $spec $comp $merged -}}
{{- end -}}
{{- end -}}
{{- /* per-cluster vmstorage replicaCount override from the distributed chart's zoneTpl.vmclusterStorageReplicas (wins over vmclusters.clusters.<name>.vmstorage.replicaCount) */ -}}
{{- $storageReplicas := dig "victoria-metrics-distributed" "zoneTpl" "vmclusterStorageReplicas" dict ($.Values.backend | default dict) -}}
{{- if and (hasKey $spec "vmstorage") (hasKey $storageReplicas $name) -}}
{{- $_ := set (index $spec "vmstorage") "replicaCount" (index $storageReplicas $name) -}}
{{- end }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{ include "groundcover.labels" $ | nindent 4 }}
spec: {{ tpl (toYaml $spec) $ | nindent 2 }}
{{- /* write balancer in front of this cluster's vminsert; same scheduling/pdb merge as the components */ -}}
{{- $vmauth := $cluster.vmauth | default dict -}}
{{- if $vmauth.enabled }}
{{- $authSpec := merge (deepCopy (omit $vmauth "enabled" "pdb")) (deepCopy $commonSpec) -}}
{{- $authPdb := merge (deepCopy ($vmauth.pdb | default dict)) (deepCopy $clusterPdb) -}}
{{- if $authPdb.enable -}}
{{- $pdbSpec := dict -}}
{{- if hasKey $authPdb "minAvailable" }}{{- $_ := set $pdbSpec "minAvailable" $authPdb.minAvailable -}}{{- end -}}
{{- if hasKey $authPdb "maxUnavailable" }}{{- $_ := set $pdbSpec "maxUnavailable" $authPdb.maxUnavailable -}}{{- end -}}
{{- $_ := set $authSpec "podDisruptionBudget" $pdbSpec -}}
{{- end -}}
{{- $uua := $authSpec.unauthorizedUserAccessSpec | default dict -}}
{{- $_ := set $uua "url_map" (append ($uua.url_map | default list) (dict "src_paths" (list "/insert/.+") "url_prefix" (list (printf "http://vminsert-%s.%s:8480" $name $.Release.Namespace)))) -}}
{{- $_ := set $authSpec "unauthorizedUserAccessSpec" $uua }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: {{ include "vmclusters.vmauthWriteName" $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{ include "groundcover.labels" $ | nindent 4 }}
spec: {{ tpl (toYaml $authSpec) $ | nindent 2 }}
{{- end }}
{{- end }}
