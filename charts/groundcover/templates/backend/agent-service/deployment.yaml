{{- $agentService := include "agent-service.values" . | fromYaml }}
{{- if $agentService.enabled | default false }}
{{- $postgres := $agentService.postgres }}
{{- $longTermMemory := $agentService.longTermMemory }}
{{- $temporal := $agentService.temporal | default dict }}
{{- $profiling := $agentService.profiling | default dict }}
{{- $profilingEnabled := and (kindIs "bool" $profiling.enabled) $profiling.enabled (eq (include "telemetry.enabled" .) "true") }}
{{- if ne (empty $agentService.config.llmProviderTlsCertificate.certificatePath) (empty $agentService.config.llmProviderTlsCertificate.privateKeyPath) }}
{{- fail "agentService.config.llmProviderTlsCertificate.certificatePath and privateKeyPath must be configured together" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-service.fullname" . }}
  annotations:
    groundcover_version: {{ default .Chart.AppVersion .Values.global.origin.tag }}
  labels:
    app: {{ include "agent-service.fullname" . }}
    {{- include "groundcover.labels" . | nindent 4 }}
spec:
  replicas: {{ $agentService.replicas }}
  selector:
    matchLabels:
      app: {{ include "agent-service.fullname" . }}
  {{- with $agentService.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "agent-service.fullname" . }}
        app.kubernetes.io/name: agent-service
        app.kubernetes.io/part-of: groundcover
        {{- with $agentService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        groundcover_version: {{ default .Chart.AppVersion .Values.global.origin.tag }}
    spec:
      terminationGracePeriodSeconds: 450
      serviceAccountName: {{ ($agentService.serviceAccount).name | default $agentService.serviceAccountName | default (include "agent-service.fullname" .) }}
      imagePullSecrets: {{ include "imagePullSecrets" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        # Create the configured agent-service database if it doesn't exist
        - name: init-postgres-db
          image: '{{ include "postgresql.initContainers.image" . }}'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - /bin/sh
            - -c
            - |
              POSTGRES_PORT="${POSTGRES_PORT:-5432}"
              echo "Checking if database ${POSTGRES_DATABASE} exists..."
              PGPASSWORD="${POSTGRES_PASSWORD}" psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USERNAME}" -d "$ADMIN_DB" -tc "SELECT 1 FROM pg_database WHERE datname = '${POSTGRES_DATABASE}'" | grep -q 1 || \
              PGPASSWORD="${POSTGRES_PASSWORD}" psql -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" -U "${POSTGRES_USERNAME}" -d "$ADMIN_DB" -c "CREATE DATABASE ${POSTGRES_DATABASE}"
              echo "Database ${POSTGRES_DATABASE} is ready"
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.secretName | default "managed-postgres-credentials" }}
                  key: {{ $postgres.hostKey | default "host" }}
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.secretName | default "managed-postgres-credentials" }}
                  key: {{ $postgres.portKey | default "port" }}
                  optional: true
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.secretName | default "managed-postgres-credentials" }}
                  key: {{ $postgres.usernameKey | default "username" }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.secretName | default "managed-postgres-credentials" }}
                  key: {{ $postgres.passwordKey | default "password" }}
            - name: POSTGRES_DATABASE
              value: {{ $postgres.database | default "agent_service" | quote }}
            - name: ADMIN_DB
              value: {{ $postgres.adminDatabase | default "postgres" | quote }}
      containers:
        - name: agent-service
          image: "{{ tpl $agentService.image.repository $ }}:{{ tpl $agentService.image.tag $ }}"
          imagePullPolicy: {{ $agentService.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GC_GROUNDCOVERVERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['groundcover_version']
            - name: GC_BACKEND_ID
              value: {{ .Values.global.backend.name | default "" | quote }}
            - name: GC_TENANT_UUID
              value: {{ .Values.global.backend.tenantUuid | default "" | quote }}
            - name: ROUTER_URL
              value: {{ $agentService.config.routerUrl | default (include "groundcover.frontendUrl" .) | quote }}
            - name: APP_URL
              value: {{ include "groundcover.frontendUrl" . | quote }}
            {{- if .Values.global.commHub.enabled }}
            # comm-hub's in-cluster base. A Slack-initiated run posts its answer back to comm-hub's
            # chat.postMessage directly, and routes its tool/router calls through comm-hub's
            # /router-proxy (backend-auth impersonation). Derived from the release name.
            - name: COMM_HUB_URL
              value: {{ printf "http://%s:8080" (include "comm-hub.fullname" .) | quote }}
            {{- end }}
            - name: LLM_PROVIDER
              value: {{ $agentService.config.llmProvider | default "bedrock" | quote }}
            {{- if $agentService.config.awsRegion }}
            - name: AWS_REGION
              value: {{ $agentService.config.awsRegion | quote }}
            {{- end }}
            {{- if $agentService.config.bedrockModelId }}
            - name: BEDROCK_MODEL_ID
              value: {{ $agentService.config.bedrockModelId | quote }}
            {{- end }}
            {{- if $agentService.config.bedrockLargeModelId }}
            - name: ORCHESTRATOR_MODEL_ID
              value: {{ $agentService.config.bedrockLargeModelId | quote }}
            {{- end }}
            {{- if eq ($agentService.config.llmProvider | default "bedrock") "vertex" }}
            {{- if $agentService.config.gcpProjectId }}
            - name: GCP_PROJECT_ID
              value: {{ $agentService.config.gcpProjectId | quote }}
            {{- end }}
            {{- if $agentService.config.gcpRegion }}
            - name: GCP_REGION
              value: {{ $agentService.config.gcpRegion | quote }}
            {{- end }}
            {{- if $agentService.config.vertexModelId }}
            - name: VERTEX_MODEL_ID
              value: {{ $agentService.config.vertexModelId | quote }}
            {{- end }}
            {{- if $agentService.config.vertexLargeModelId }}
            - name: VERTEX_ORCHESTRATOR_MODEL_ID
              value: {{ $agentService.config.vertexLargeModelId | quote }}
            {{- end }}
            {{- end }}
            {{- if eq ($agentService.config.llmProvider | default "bedrock") "azure" }}
            {{- if $agentService.config.azureFoundryBaseUrl }}
            - name: AZURE_FOUNDRY_BASE_URL
              value: {{ $agentService.config.azureFoundryBaseUrl | quote }}
            {{- end }}
            {{- if $agentService.config.azureFoundryResource }}
            - name: AZURE_FOUNDRY_RESOURCE
              value: {{ $agentService.config.azureFoundryResource | quote }}
            {{- end }}
            {{- if $agentService.config.azureModelId }}
            - name: AZURE_MODEL_ID
              value: {{ $agentService.config.azureModelId | quote }}
            {{- end }}
            {{- if $agentService.config.azureOrchestratorModelId }}
            - name: AZURE_ORCHESTRATOR_MODEL_ID
              value: {{ $agentService.config.azureOrchestratorModelId | quote }}
            {{- end }}
            {{- if $agentService.config.azureFoundryUseEntra }}
            - name: AZURE_FOUNDRY_USE_ENTRA
              value: {{ $agentService.config.azureFoundryUseEntra | quote }}
            {{- end }}
            {{- if and $agentService.azureFoundryCredentials $agentService.azureFoundryCredentials.secretName }}
            - name: AZURE_FOUNDRY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $agentService.azureFoundryCredentials.secretName | quote }}
                  key: {{ $agentService.azureFoundryCredentials.apiKeySecretKey | default "api-key" | quote }}
            {{- else if not $agentService.config.azureFoundryUseEntra }}
            {{- fail "agentService.azureFoundryCredentials.secretName is required when agentService.config.llmProvider=azure and agentService.config.azureFoundryUseEntra=false. Either provide the K8s secret holding the Foundry API key, or set azureFoundryUseEntra=true to use AKS workload identity instead." }}
            {{- end }}
            {{- end }}
            - name: FLEET_MANAGER_URL
              value: {{ include "fleet-manager.base.url" . | quote }}
            {{- if $agentService.config.anthropicModelId }}
            - name: ANTHROPIC_MODEL_ID
              value: {{ $agentService.config.anthropicModelId | quote }}
            {{- end }}
            {{- if $agentService.config.anthropicLargeModelId }}
            - name: ANTHROPIC_LARGE_MODEL_ID
              value: {{ $agentService.config.anthropicLargeModelId | quote }}
            {{- end }}
            - name: ANTHROPIC_AUTH_HEADER_NAME
              value: {{ $agentService.config.anthropicAuthHeaderName | quote }}
            {{- if or (eq ($agentService.config.llmProvider | default "bedrock") "anthropic") (eq ($agentService.config.llmProvider | default "bedrock") "anthropic_compatible_endpoint") }}
            - name: ANTHROPIC_API_KEY_SECRET_REF
              value: {{ required (printf "agentService.config.anthropicApiKeySecretRef is required when agentService.config.llmProvider=%s. Provide a Fleet Manager secret ref like secretRef::store::<id>." ($agentService.config.llmProvider | default "bedrock")) $agentService.config.anthropicApiKeySecretRef | quote }}
            {{- end }}
            {{- if eq ($agentService.config.llmProvider | default "bedrock") "anthropic_compatible_endpoint" }}
            - name: ANTHROPIC_COMPATIBLE_BASE_URL
              value: {{ required "agentService.config.anthropicCompatibleBaseUrl is required when agentService.config.llmProvider=anthropic_compatible_endpoint." $agentService.config.anthropicCompatibleBaseUrl | quote }}
            {{- end }}
            {{- if $agentService.config.llmProviderTlsCertificate.certificatePath }}
            - name: LLM_CLIENT_CERTIFICATE_PATH
              value: {{ $agentService.config.llmProviderTlsCertificate.certificatePath | quote }}
            - name: LLM_PRIVATE_KEY_PATH
              value: {{ $agentService.config.llmProviderTlsCertificate.privateKeyPath | quote }}
            {{- end }}
            {{- if $agentService.gcpCredentials }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/gcp/gcp-config.json
            {{- end }}
            - name: OTEL_TRACING_ENABLED
              value: {{ $agentService.config.otelTracingEnabled | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $agentService.config.otelServiceName | quote }}
            {{- if $agentService.config.otelExporterOtlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $agentService.config.otelExporterOtlpEndpoint | quote }}
            {{- else if eq (include "telemetry.enabled" .) "true" }}
            - name: TRACING_APIKEY
              valueFrom:
                secretKeyRef:
                  key: {{ template "groundcover.apikeySecretKey" . }}
                  name: {{ template "groundcover.apikeySecretName" . }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ include "telemetry.traces.otlpUrl" . | quote }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "apikey=$(TRACING_APIKEY)"
            {{- end }}
            {{- if $agentService.config.otelRecordConversationContent }}
            - name: OTEL_RECORD_CONVERSATION_CONTENT
              value: {{ $agentService.config.otelRecordConversationContent | quote }}
            {{- end }}
            - name: DEV_SHOW_TRACE_ID
              value: {{ $agentService.config.devShowTraceId | default "false" | quote }}
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.secretName | default "managed-postgres-credentials" }}
                  key: {{ $postgres.hostKey | default "host" }}
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.secretName | default "managed-postgres-credentials" }}
                  key: {{ $postgres.portKey | default "port" }}
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.secretName | default "managed-postgres-credentials" }}
                  key: {{ $postgres.usernameKey | default "username" }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgres.secretName | default "managed-postgres-credentials" }}
                  key: {{ $postgres.passwordKey | default "password" }}
            - name: POSTGRES_DATABASE
              value: {{ $postgres.database | default "agent_service" | quote }}
            {{- if $longTermMemory }}
            - name: LONG_TERM_MEMORY_ENABLED
              value: {{ $longTermMemory.enabled | default false | quote }}
            {{- if $longTermMemory.enabled }}
            - name: LONG_TERM_MEMORY_EMBEDDING_DIMS
              value: {{ $longTermMemory.embeddingDims | default 1024 | quote }}
            - name: LONG_TERM_MEMORY_EMBEDDING_MODEL
              value: {{ $longTermMemory.embeddingModel | default "bedrock:amazon.titan-embed-text-v2:0" | quote }}
            - name: LONG_TERM_MEMORY_NAMESPACE
              value: {{ $longTermMemory.namespace | default "sre_agent_memories" | quote }}
            - name: LONG_TERM_MEMORY_NAMESPACE_PER_DEPLOYMENT
              value: {{ $longTermMemory.namespacePerDeployment | default false | quote }}
            {{- if $longTermMemory.namespacePerDeployment }}
            - name: LONG_TERM_MEMORY_DEV_USER
              value: {{ required "agent-service.longTermMemory.devUser is required when namespacePerDeployment=true" $longTermMemory.devUser | quote }}
            {{- end }}
            - name: ENABLE_DIRECT_MEMORY_MANAGEMENT_TOOLS
              value: {{ $longTermMemory.enableDirectMemoryManagementTools | default false | quote }}
            {{- end }}
            {{- end }}
            {{- if $temporal.enabled }}
            - name: TEMPORAL_ENABLED
              value: "true"
            - name: TEMPORAL_ADDRESS
              value: {{ $temporal.address | default (printf "%s-temporal-frontend:7233" .Release.Name) | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ $temporal.namespace | default "default" | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ $temporal.taskQueue | default "agent-service-runs" | quote }}
            # Stage 2 only: turn on after all old workers have drained from this queue.
            - name: RUN_ADMISSION_ENABLED
              value: {{ $temporal.runAdmissionEnabled | default false | quote }}
            {{- end }}
            {{- if $profilingEnabled }}
            - name: PROFILING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "groundcover.apikeySecretName" .) (dig "apiKeySecret" "name" "" $profiling) | quote }}
                  key: {{ default (include "groundcover.apikeySecretKey" .) (dig "apiKeySecret" "key" "" $profiling) | quote }}
                  optional: true
            - name: PROFILING_CONFIG
              value: {{ dict "server_address" (default (include "telemetry.metrics.base.url" .) $profiling.serverAddress) "tags" (dict "cluster_id" (include "groundcover.clusterId" .) "env" (include "groundcover.env" .) "namespace" .Release.Namespace) | toJson | quote }}
            {{- end }}
            {{- with $agentService.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $agentService.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $agentService.gcpCredentials $agentService.extraVolumeMounts }}
          volumeMounts:
            {{- if $agentService.gcpCredentials }}
            - name: gcp-credentials
              mountPath: /var/run/secrets/gcp
              readOnly: true
            - name: gcp-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            {{- end }}
            {{- with $agentService.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            {{- toYaml $agentService.resources | nindent 12 }}
          {{- include "groundcover.containerResizePolicy" (dict "value" $agentService.resizePolicy "path" "agentService.resizePolicy" "kubeVersion" .Capabilities.KubeVersion.GitVersion "indent" 10) }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      {{- with $agentService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $agentService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $agentService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $agentService.gcpCredentials $agentService.extraVolumes }}
      volumes:
        {{- if $agentService.gcpCredentials }}
        - name: gcp-credentials
          configMap:
            name: {{ $agentService.gcpCredentials.configMapName }}
        - name: gcp-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ $agentService.gcpCredentials.audience | quote }}
                  expirationSeconds: 3600
                  path: gcp-token
        {{- end }}
        {{- with $agentService.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
