{{- if and .Values.global.ingestor.enabled .Values.global.backend.enabled }}
{{- $ingestor := mergeOverwrite (deepCopy .Values.ingestor) (default (dict) .Values.global.ingestor) }}
{{- $internalIngress := dig "internalIngress" dict (index .Values "incloud-ingress" | default dict) }}
{{- $traceRowsPath := "/ingest/v2/otlp/trace-rows" }}
{{- $traceRowsRouted := false }}
{{- range $route := $internalIngress.routes }}
{{- range $route.paths }}
{{- if eq .path $traceRowsPath }}{{ $traceRowsRouted = true }}{{ end }}
{{- end }}
{{- end }}
{{- if and (dig "internalIngress" "enabled" false $ingestor) (eq (include "groundcover.sensor.otelTracesAsLogs" (dict "sensorValues" $ingestor)) "false") (not $traceRowsRouted) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vector.fullname" . }}-internal-trace-rows
  labels:
    {{- include "groundcover.labels" . | nindent 4 }}
    app.kubernetes.io/name: kong-internal
  annotations:
    konghq.com/plugins: ingest-v2-rewrite-to-v1-traces
spec:
  ingressClassName: {{ $internalIngress.ingressClassName }}
  rules:
    - http:
        paths:
          - path: {{ $traceRowsPath }}
            pathType: Exact
            backend:
              service:
                name: {{ include "vector.fullname" . }}
                port:
                  number: {{ include "vector.cluster.otlp.http.trace-rows.port" . }}
{{- end }}
{{- end }}
