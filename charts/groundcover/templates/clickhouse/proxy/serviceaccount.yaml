{{- if (.Values.global.clickhouse.ha | default dict).enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clickhouse.proxyServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse-proxy.labels" . | nindent 4 }}
# The proxy is plain HAProxy with no Kubernetes API access and no Role/RoleBinding - it exists
# only so the Deployment has a distinct identity. No token to mount.
automountServiceAccountToken: false
{{- end }}
