{{- if and (.Values.global.clickhouse.ha | default dict).enabled .Values.clickhouseProxy.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "clickhouse.proxyServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse-proxy.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "clickhouse.proxyServiceName" . }}
  minReplicas: {{ .Values.clickhouseProxy.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.clickhouseProxy.autoscaling.maxReplicas }}
  {{- with .Values.clickhouseProxy.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  metrics:
  {{- if .Values.clickhouseProxy.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.clickhouseProxy.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.clickhouseProxy.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.clickhouseProxy.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
{{- end }}
