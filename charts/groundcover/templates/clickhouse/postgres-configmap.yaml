{{- if and .Values.global.backend.enabled .Values.global.aiO11yService.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-postgres-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "groundcover.labels" . | nindent 4 }}
data:
  PGSSLMODE: {{ .Values.dbManager.db.sslmode | quote }}
{{- end }}
